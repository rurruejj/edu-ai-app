<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>EDU AI</title>
<link rel="stylesheet" href="styles.css?v=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C6CFF"/><stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></symbol>
  <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></symbol>
  <symbol id="i-clip" viewBox="0 0 24 24"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-circle-x" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></symbol>
  <symbol id="i-circle-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></symbol>
  <symbol id="i-sparkles" viewBox="0 0 24 24"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></symbol>
  <symbol id="i-flame" viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></symbol>
  <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></symbol>
</svg>

<div id="app">
  <main id="views">

    <section class="view active" id="view-chat">
      <div class="hdr">
        <button class="icon-btn" id="menuBtn"><svg class="ic"><use href="#i-menu"/></svg></button>
        <div class="hdr-text">
          <div class="hdr-title" id="titleEl">EDU AI</div>
          <div class="hdr-sub" id="subEl"></div>
        </div>
        <button class="icon-btn" id="renameBtn"><svg class="ic"><use href="#i-pencil"/></svg></button>
      </div>
      <div id="chat"></div>
      <div id="filebar">
        <svg class="ic sm"><use href="#i-clip"/></svg>
        <span id="filename"></span>
        <button id="removeFile" class="x-small"><svg class="ic sm"><use href="#i-x"/></svg></button>
      </div>
      <div class="composer">
        <button class="round attach-btn" id="attach"><svg class="ic"><use href="#i-clip"/></svg></button>
        <textarea class="field" id="input" rows="1" placeholder="Напиши вопрос или прикрепи файл"></textarea>
        <button class="round send-btn" id="send"><svg class="ic"><use href="#i-up"/></svg></button>
        <input type="file" id="fileInput" class="hidden" accept=".pdf,.txt,.png,.jpg,.jpeg,.webp,.mp3,.wav,.m4a,.ogg,.aac,.flac">
      </div>
    </section>

    <section class="view" id="view-tests">
      <div class="page-title">Тесты</div>
      <div class="page-sub">Проверь, как ты усвоил материал</div>
      <div class="page" id="testsBody"></div>
    </section>

    <section class="view" id="view-profile">
      <div class="page-title">Профиль</div>
      <div class="page" id="profileBody"></div>
    </section>

  </main>

  <nav class="tabbar">
    <button class="tab active" data-tab="chat"><span class="ico"><svg class="ic"><use href="#i-chat"/></svg></span><span>Чат</span></button>
    <button class="tab" data-tab="tests"><span class="ico"><svg class="ic"><use href="#i-list"/></svg></span><span>Тесты</span></button>
    <button class="tab" data-tab="profile"><span class="ico"><svg class="ic"><use href="#i-user"/></svg></span><span>Профиль</span></button>
  </nav>
</div>

<div class="quiz" id="quiz"><div id="quizBody"></div></div>

<div class="sheet-wrap" id="sheet">
  <div class="sheet-bg" id="sheetBg"></div>
  <div class="sheet">
    <div class="grab"></div>
    <div class="sheet-title" id="sheetTitle"></div>
    <div id="sheetBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js?v=1"></script>
</body>
</html>
