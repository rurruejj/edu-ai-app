<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>EDU AI</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column;
    background: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #000000);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px;
    background: var(--tg-theme-secondary-bg-color, #f1f1f1);
    font-weight: 600;
  }
  header button {
    background: none; border: none; cursor: pointer;
    color: var(--tg-theme-link-color, #2481cc); font-size: 14px;
  }
  #chat { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 88%; padding: 10px 14px; border-radius: 16px; line-height: 1.4; word-wrap: break-word; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #ffffff); white-space: pre-wrap; }
  .msg.bot { align-self: flex-start; background: var(--tg-theme-secondary-bg-color, #f1f1f1); }
  .msg.bot p { margin: 0 0 8px; }
  .msg.bot p:last-child { margin-bottom: 0; }
  .msg.bot pre { overflow-x: auto; }
  .file { font-size: 13px; opacity: 0.85; margin-bottom: 4px; }
  #filebar { display: none; padding: 6px 16px; font-size: 14px; background: var(--tg-theme-secondary-bg-color, #f1f1f1); }
  #filebar button { border: none; background: none; cursor: pointer; font-size: 16px; }
  footer { display: flex; align-items: flex-end; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px)); }
  #input {
    flex: 1; resize: none; max-height: 120px; padding: 10px 12px;
    border-radius: 18px; border: 1px solid rgba(128,128,128,0.4);
    background: var(--tg-theme-bg-color, #ffffff); color: var(--tg-theme-text-color, #000000);
    font-family: inherit; font-size: 16px;
  }
  .round {
    width: 42px; height: 42px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #ffffff);
    font-size: 18px; flex-shrink: 0;
  }
  .round:disabled { opacity: 0.5; }
  #attach { background: var(--tg-theme-secondary-bg-color, #f1f1f1); color: var(--tg-theme-text-color, #000000); }
</style>
</head>
<body>
<header>
  <span>🎓 EDU AI</span>
  <button id="clearBtn">Очистить чат</button>
</header>
<div id="chat"></div>
<div id="filebar"><span id="filename"></span> <button id="removeFile">✕</button></div>
<footer>
  <button class="round" id="attach" title="Прикрепить файл">📎</button>
  <textarea id="input" rows="1" placeholder="Напиши вопрос или прикрепи файл..."></textarea>
  <button class="round" id="send">➤</button>
  <input type="file" id="fileInput" style="display:none" accept=".pdf,.txt,.png,.jpg,.jpeg,.webp,.mp3,.wav,.m4a,.ogg,.aac,.flac">
</footer>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

// Адрес нашего сервера (туннеля). Его передаёт бот в ссылке: ?api=...
const API = (new URLSearchParams(location.search).get("api") || "").replace(/\/$/, "");

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const fileInput = document.getElementById("fileInput");
const filebar = document.getElementById("filebar");
const filenameEl = document.getElementById("filename");
let pendingFile = null;

function render(el, role, text) {
  if (role === "user") {
    el.textContent = text;
  } else {
    el.innerHTML = DOMPurify.sanitize(marked.parse(text));
  }
}

function addMessage(role, text, fileName) {
  const div = document.createElement("div");
  div.className = "msg " + (role === "user" ? "user" : "bot");
  render(div, role, text || "");
  if (fileName) {
    const f = document.createElement("div");
    f.className = "file";
    f.textContent = "📎 " + fileName;
    div.prepend(f);
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function setFile(file) {
  pendingFile = file;
  if (file) {
    filenameEl.textContent = "📎 " + file.name;
    filebar.style.display = "block";
  } else {
    filebar.style.display = "none";
    fileInput.value = "";
  }
}

async function loadHistory() {
  if (!API) {
    addMessage("model", "⚠️ Не указан адрес сервера. Открой приложение через команду /app в боте.");
    return;
  }
  try {
    const r = await fetch(API + "/api/history", { headers: { "X-Init-Data": tg.initData } });
    if (!r.ok) {
      addMessage("model", "⚠️ Открой это приложение из Telegram, через кнопку в боте.");
      return;
    }
    const data = await r.json();
    if (!data.has_key) {
      addMessage("model", "Сначала подключи нейросеть: напиши боту команду /setkey и пришли свой ключ Gemini.");
      return;
    }
    if (data.messages.length === 0) {
      addMessage("model", "Привет! Задай вопрос или прикрепи файл (PDF, фото, аудио лекции), и я объясню простым языком 🎓");
    }
    data.messages.forEach(m => addMessage(m.role, m.text, m.file_name));
  } catch (e) {
    addMessage("model", "⚠️ Не удалось связаться с сервером. Проверь, что туннель и сервер запущены.");
  }
}

async function send() {
  const text = input.value.trim();
  if (!text && !pendingFile) return;

  const fd = new FormData();
  fd.append("text", text);
  if (pendingFile) fd.append("file", pendingFile);

  addMessage("user", text, pendingFile ? pendingFile.name : null);
  input.value = "";
  input.style.height = "auto";
  setFile(null);
  sendBtn.disabled = true;

  const thinking = addMessage("model", "Думаю... 🧠");
  try {
    const r = await fetch(API + "/api/chat", {
      method: "POST",
      headers: { "X-Init-Data": tg.initData },
      body: fd,
    });
    const data = await r.json();
    if (r.ok) {
      render(thinking, "model", data.answer);
    } else {
      thinking.textContent = "⚠️ " + (data.detail || "Ошибка");
    }
  } catch (e) {
    thinking.textContent = "⚠️ Не удалось связаться с сервером.";
  }
  sendBtn.disabled = false;
  chat.scrollTop = chat.scrollHeight;
}

sendBtn.addEventListener("click", send);
document.getElementById("attach").addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", () => setFile(fileInput.files[0] || null));
document.getElementById("removeFile").addEventListener("click", () => setFile(null));
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = input.scrollHeight + "px";
});
document.getElementById("clearBtn").addEventListener("click", async () => {
  try {
    await fetch(API + "/api/clear", { method: "POST", headers: { "X-Init-Data": tg.initData } });
  } catch (e) {}
  chat.innerHTML = "";
  loadHistory();
});

loadHistory();
</script>
</body>
</html>
